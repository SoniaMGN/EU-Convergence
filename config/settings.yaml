# Project C settings. Data section (milestone M1). Other sections (HP lambda, trim, HAC lag,
# bootstrap draws, commuter groups) are added by the people who own those steps.
seed: 20261105

years:
  start: 2000
  end: 2024
  income_end: 2023          # household income: the 2024 release covers too few regions

expected_regions: 244       # GISCO NUTS 2024 level-2 regions with EU_STAT = T
eu_aggregate: EU27_2020     # kept: needed for the EU benchmark (GDP index, employment rate)

api_base: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data
gisco_url: https://gisco-services.ec.europa.eu/distribution/v2/nuts/geojson/NUTS_RG_20M_2024_4326_LEVL_2.geojson
chunk_size: 60              # fallback only: regions per request if a full request is refused
user_agent: eu-convergence-student-project

# Exactly the datasets and filters of the research plan ("Data specification").
# unit_kept is applied after download (the plan's filter column does not include it).
# labour: true -> observations flagged u (low reliability) are dropped.
datasets:
  gdp_pps:            {dataset: nama_10r_2gdp,   filters: {unit: PPS_EU27_2020_HAB}}
  gdp_index_pub:      {dataset: nama_10r_2gdp,   filters: {unit: PPS_HAB_EU27_2020}}
  gdp_eur:            {dataset: nama_10r_2gdp,   filters: {unit: EUR_HAB}}
  real_gdp:           {dataset: nama_10r_2gvagr, filters: {na_item: B1GQ}, unit_kept: I20}
  population:         {dataset: nama_10r_3popgdp, filters: {}, unit_kept: THS}
  employment:         {dataset: lfst_r_lfe2emprt, filters: {unit: PC, age: Y20-64, sex: T}, labour: true}
  youth_unemployment: {dataset: lfst_r_lfu3rt,    filters: {unit: PC, age: Y15-24, sex: T, isced11: TOTAL}, labour: true}
  household_income:   {dataset: nama_10r_2hhinc,  filters: {na_item: B6N, direct: BAL}, unit_kept: PPS_EU27_2020_HAB}
  gva_2000:           {dataset: nama_10r_3gva,    filters: {unit: CP_MEUR, time: "2000"}}

# Balanced panels: a region is in a panel only if every listed variable is present in every year of the window.
panels:
  main:                  {window: [2000, 2024], variables: [gdp_pps, population, real_gdp]}
  gdp_2010_2024:         {window: [2010, 2024], variables: [gdp_pps, population, real_gdp]}   # RQ1 sigma sample
  gdp_2015_2024:         {window: [2015, 2024], variables: [gdp_pps, population, real_gdp]}
  employment_2000_2024:  {window: [2000, 2024], variables: [employment]}
  employment_2015_2024:  {window: [2015, 2024], variables: [employment]}
  youth_2000_2024:       {window: [2000, 2024], variables: [youth_unemployment]}
  youth_2015_2024:       {window: [2015, 2024], variables: [youth_unemployment]}
  gdp_income_2000_2023:  {window: [2000, 2023], variables: [gdp_pps, household_income]}

# Series whose break flags (b) mark a region as "GDP break flagged"
gdp_break_series: [gdp_pps, real_gdp]
